<title id="wt">A stale read, caught: key k/0</title>
<desc id="wd">linearizable.kv exhausted its search of the 542 operations on k/0 (1,578 states) and found no order a correct register could produce. At that point the register held 14000167, written by op 2480, and op 2493 (process 13, read) returned 15000136. That value was written by op 2331, which every linearization places before the value the register held. Drawn from verdict.json of run r_2026_09_28_2071.</desc>
