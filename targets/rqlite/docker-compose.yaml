name: prothesis-rqlite

# A 3-node rqlite cluster as a Synthesis target. Nothing here is modified for
# the harness: the image is the upstream release pinned by digest, rqlited is
# started with its ordinary flags through the image's own entrypoint, and
# faults arrive from a NET_ADMIN sidecar the harness joins to a container's
# network namespace at run time.
#
# The image under test is named here, and this file is NOT covered by
# .prothesis/lock. The harness records the image identity that actually ran in
# every world (sut.images, D-070); compare it with the digest below before a
# world counts. See README.md, "What is not claimed".
#
# Topology, following targets/etcd for the same measured reasons:
#
#  * ONE SERVICE PER NODE, each publishing its HTTP API port to 127.0.0.1.
#    Container IPs are not routable from a Windows host, so a host-side probe
#    and a host-side driver have no other way in. The Raft port (4002) is not
#    published: only the nodes use it.
#
#  * ONE NETWORK. rqlite carries Raft and its node-to-node cluster calls on the
#    Raft port, and HTTP on the API port, both addressed by the service name.
#    A net.partition drops the node's traffic to its peers' addresses; the
#    host's traffic to the published port is not a peer address, so a
#    partitioned node stays reachable by the driver.
#
#  * restart: "no", init: false. Auto-restart would mask no_crash; PID 1 must
#    be rqlited itself (the entrypoint execs it) so proc.pause freezes the real
#    process.
#
#  * NAMED VOLUMES at /rqlite/file, the image's own VOLUME path. Without them
#    Docker would create an anonymous volume per container on every world.

networks:
  rq:
    name: "${RQ_PREFIX:-prothesis}-rqlite"

volumes:
  n1data: {}
  n2data: {}
  n3data: {}

x-rqlite: &rqlite
  image: rqlite/rqlite:10.5.3@sha256:de385382ef6d93a4b4b831eac4d419cfa35fdb1515621a4ad8ba8b5a5beeb6b5
  restart: "no" # auto-restart would mask no_crash. NEVER change this.
  init: false # PID 1 must be rqlited so proc.pause freezes the real process
  stop_grace_period: 3s
  networks: [rq]
  healthcheck:
    # busybox wget exits non-zero on a non-2xx answer. /readyz without an
    # explicit timeout can wait 30 s on the leader.
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4001/readyz?timeout=2s"]
    interval: 1s
    timeout: 3s
    retries: 60
    start_period: 2s

# Every node is started with the same cluster flags. The Raft timings are
# rqlite 10.5.3's defaults for heartbeat and election (1 s each, `rqlited -h`)
# and hashicorp/raft's default leader lease (500 ms, which rqlite uses when its
# flag is 0s), restated so the numbers a fault window is chosen against are
# visible here rather than left to library defaults.
#
# -bootstrap-expect 3 with the same -join list on all three: the documented
# way to form a fixed three-voter cluster under Compose.

services:
  rq-n1:
    <<: *rqlite
    container_name: "${RQ_PREFIX:-prothesis}-rq-n1"
    hostname: rq-n1
    ports: ["127.0.0.1:${RQ_PORT_N1:-14001}:4001"]
    volumes: ["n1data:/rqlite/file"]
    command:
      - -node-id=rq-n1
      - -http-addr=0.0.0.0:4001
      - -http-adv-addr=rq-n1:4001
      - -raft-addr=0.0.0.0:4002
      - -raft-adv-addr=rq-n1:4002
      - -bootstrap-expect=3
      - -join=rq-n1:4002,rq-n2:4002,rq-n3:4002
      - -raft-heartbeat-timeout=1s
      - -raft-election-timeout=1s
      - -raft-leader-lease-timeout=500ms

  rq-n2:
    <<: *rqlite
    container_name: "${RQ_PREFIX:-prothesis}-rq-n2"
    hostname: rq-n2
    ports: ["127.0.0.1:${RQ_PORT_N2:-14002}:4001"]
    volumes: ["n2data:/rqlite/file"]
    command:
      - -node-id=rq-n2
      - -http-addr=0.0.0.0:4001
      - -http-adv-addr=rq-n2:4001
      - -raft-addr=0.0.0.0:4002
      - -raft-adv-addr=rq-n2:4002
      - -bootstrap-expect=3
      - -join=rq-n1:4002,rq-n2:4002,rq-n3:4002
      - -raft-heartbeat-timeout=1s
      - -raft-election-timeout=1s
      - -raft-leader-lease-timeout=500ms

  rq-n3:
    <<: *rqlite
    container_name: "${RQ_PREFIX:-prothesis}-rq-n3"
    hostname: rq-n3
    ports: ["127.0.0.1:${RQ_PORT_N3:-14003}:4001"]
    volumes: ["n3data:/rqlite/file"]
    command:
      - -node-id=rq-n3
      - -http-addr=0.0.0.0:4001
      - -http-adv-addr=rq-n3:4001
      - -raft-addr=0.0.0.0:4002
      - -raft-adv-addr=rq-n3:4002
      - -bootstrap-expect=3
      - -join=rq-n1:4002,rq-n2:4002,rq-n3:4002
      - -raft-heartbeat-timeout=1s
      - -raft-election-timeout=1s
      - -raft-leader-lease-timeout=500ms
