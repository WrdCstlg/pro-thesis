name: prothesis-redis

# Redis 8 with asynchronous replication and Sentinel failover, as a Synthesis
# target: one primary (redis-n1 at boot), two replicas, and one Sentinel per
# node with a quorum of two. Nothing here is modified for the harness: every
# container runs the upstream image pinned by digest, unmodified, with its own
# entrypoint; faults arrive from a NET_ADMIN sidecar the harness joins to a
# node's network namespace at run time.
#
# The image under test is named here, and this file is NOT covered by
# .prothesis/lock. The harness records the image identity of every declared
# node in every world (sut.images, D-070); compare it with the digest below
# before a world counts. The Sentinel and health-shim containers are not
# declared nodes, so their image is not recorded (README.md, "Contract gaps").
# The topology the verdict depends on (primary, quorum, timings) is restated in
# driver.cmd, which the lock does cover, and the driver refuses a world whose
# Sentinels report anything else.
#
# Topology:
#
#  * THREE NODE SERVICES, redis-n1..n3, the harness's nodes. Each publishes
#    three ports to 127.0.0.1, because container IPs are not routable from a
#    Windows host and the host-side driver, probes and health check have no
#    other way in: RESP (6379), its Sentinel (26379) and its health shim
#    (8080). Host bands 16379..16381, 16479..16481, 16581..16583.
#
#  * ONE SENTINEL PER NODE, in that node's network namespace
#    (network_mode: service:redis-nX). A net.partition of a node is iptables
#    rules in that namespace dropping the other nodes' addresses, so it cuts
#    the node AND its Sentinel off from the rest, as a co-located deployment
#    is cut. The trade-off, stated: a partitioned primary keeps its own
#    Sentinel, which goes on naming it, and the majority's two Sentinels make
#    the quorum that fails over without it.
#
#  * ONE HEALTH SHIM PER NODE, in that node's namespace too: the harness's
#    health probe is HTTP and Redis has none (README.md, "Contract gaps"). The
#    shim is cmd/redishealth cross-compiled for Linux, bind-mounted read-only
#    into a container of the same pinned image, entrypoint overridden. It
#    talks to the node over 127.0.0.1 inside the namespace.
#
#  * ONE NETWORK. Replication and Sentinel traffic stay on it, addressed by
#    service name and container address: no announce-ip, no traffic through
#    the host. A partitioned node stays reachable by the driver through its
#    published port, which is not a peer address.
#
#  * restart: "no", init: false. Auto-restart would mask no_crash; PID 1 must
#    be redis-server itself (the image's entrypoint execs it) so proc.pause
#    freezes the real process.
#
#  * NAMED VOLUMES at /data for the three nodes, removed with the world.
#    Sentinel writes its state into a tmpfs, so every world's Sentinels start
#    from the configuration below and nothing else.
#
# Redis is started with its defaults plus --port and --protected-mode no
# (needed for cross-container access without a password; stated rather than
# left to the image). In particular min-replicas-to-write is 0, its default:
# a primary cut off from its replicas goes on accepting writes, which Redis
# documents can be lost when it is demoted.
#
# Sentinel timing, chosen so a 4.5 s partition can trigger a failover:
# down-after-milliseconds 1000 (subjectively down after 1 s without a valid
# PING reply), failover-timeout 3000, parallel-syncs 1, quorum 2. Sentinel
# needs a WRITABLE config file (it rewrites it with what it learns), so a
# shell from the image writes these lines into a tmpfs and then execs the
# image's entrypoint as `redis-server <conf> --sentinel`, the form the
# entrypoint recognises as Sentinel and whose config file it chowns to redis.

networks:
  rd:
    name: "${RD_PREFIX:-prothesis}-redis"

volumes:
  n1data: {}
  n2data: {}
  n3data: {}

x-image: &image
  image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
  restart: "no" # auto-restart would mask no_crash. NEVER change this.
  init: false # PID 1 must be redis-server so proc.pause freezes the real process
  stop_grace_period: 3s

x-node: &node
  <<: *image
  networks: [rd]
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "6379", "ping"]
    interval: 1s
    timeout: 3s
    retries: 60
    start_period: 2s

x-sentinel: &sentinel
  <<: *image
  tmpfs: ["/etc/redis-sentinel"]
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "26379", "ping"]
    interval: 1s
    timeout: 3s
    retries: 60
    start_period: 2s
  command:
    - sh
    - -c
    - >-
      printf '%s\n'
      'port 26379'
      'dir /tmp'
      'protected-mode no'
      'sentinel resolve-hostnames yes'
      'sentinel monitor mymaster redis-n1 6379 2'
      'sentinel down-after-milliseconds mymaster 1000'
      'sentinel failover-timeout mymaster 3000'
      'sentinel parallel-syncs mymaster 1'
      > /etc/redis-sentinel/sentinel.conf
      && exec docker-entrypoint.sh redis-server /etc/redis-sentinel/sentinel.conf --sentinel

x-health: &health
  <<: *image
  entrypoint: ["/usr/local/bin/redishealth"]
  command: ["--listen", ":8080", "--redis", "127.0.0.1:6379", "--timeout", "1s"]
  volumes: ["./bin/redishealth:/usr/local/bin/redishealth:ro"]

services:
  redis-n1:
    <<: *node
    container_name: "${RD_PREFIX:-prothesis}-redis-n1"
    hostname: redis-n1
    ports:
      - "127.0.0.1:${RD_PORT_N1:-16379}:6379"
      - "127.0.0.1:${RD_SENTINEL_PORT_N1:-16479}:26379"
      - "127.0.0.1:${RD_HEALTH_PORT_N1:-16581}:8080"
    volumes: ["n1data:/data"]
    command: ["redis-server", "--port", "6379", "--protected-mode", "no"]

  redis-n2:
    <<: *node
    container_name: "${RD_PREFIX:-prothesis}-redis-n2"
    hostname: redis-n2
    ports:
      - "127.0.0.1:${RD_PORT_N2:-16380}:6379"
      - "127.0.0.1:${RD_SENTINEL_PORT_N2:-16480}:26379"
      - "127.0.0.1:${RD_HEALTH_PORT_N2:-16582}:8080"
    volumes: ["n2data:/data"]
    command: ["redis-server", "--port", "6379", "--protected-mode", "no", "--replicaof", "redis-n1", "6379"]
    depends_on:
      redis-n1: { condition: service_healthy }

  redis-n3:
    <<: *node
    container_name: "${RD_PREFIX:-prothesis}-redis-n3"
    hostname: redis-n3
    ports:
      - "127.0.0.1:${RD_PORT_N3:-16381}:6379"
      - "127.0.0.1:${RD_SENTINEL_PORT_N3:-16481}:26379"
      - "127.0.0.1:${RD_HEALTH_PORT_N3:-16583}:8080"
    volumes: ["n3data:/data"]
    command: ["redis-server", "--port", "6379", "--protected-mode", "no", "--replicaof", "redis-n1", "6379"]
    depends_on:
      redis-n1: { condition: service_healthy }

  # Every Sentinel resolves redis-n1 when it loads its configuration, so each
  # waits for redis-n1 as well as for the node whose namespace it joins.
  sentinel-n1:
    <<: *sentinel
    container_name: "${RD_PREFIX:-prothesis}-sentinel-n1"
    network_mode: "service:redis-n1"
    depends_on:
      redis-n1: { condition: service_healthy }

  sentinel-n2:
    <<: *sentinel
    container_name: "${RD_PREFIX:-prothesis}-sentinel-n2"
    network_mode: "service:redis-n2"
    depends_on:
      redis-n1: { condition: service_healthy }
      redis-n2: { condition: service_healthy }

  sentinel-n3:
    <<: *sentinel
    container_name: "${RD_PREFIX:-prothesis}-sentinel-n3"
    network_mode: "service:redis-n3"
    depends_on:
      redis-n1: { condition: service_healthy }
      redis-n3: { condition: service_healthy }

  health-n1:
    <<: *health
    container_name: "${RD_PREFIX:-prothesis}-health-n1"
    network_mode: "service:redis-n1"
    depends_on:
      redis-n1: { condition: service_started }

  health-n2:
    <<: *health
    container_name: "${RD_PREFIX:-prothesis}-health-n2"
    network_mode: "service:redis-n2"
    depends_on:
      redis-n2: { condition: service_started }

  health-n3:
    <<: *health
    container_name: "${RD_PREFIX:-prothesis}-health-n3"
    network_mode: "service:redis-n3"
    depends_on:
      redis-n3: { condition: service_started }
